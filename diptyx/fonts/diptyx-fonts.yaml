# Diptyx font pack: SD-card reader fonts curated for the Diptyx panels (~138 ppi), built with
# lib/EpdFont/scripts/build-sd-fonts.py (see diptyx/fonts/README.md). All three families are SIL OFL 1.1.
scriptGroups:
  - {tag: latin, label: Latin}
  - {tag: cyrillic, label: Cyrillic}

families:
  - name: Bitter
    description: "Slab serif designed for e-ink (Latin, Cyrillic)"
    scripts: [latin, cyrillic]
    intervals: latin-ext,cyrillic,ipa-chars
    sizes: [10, 12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter%5Bwght%5D.ttf", variable: {wght: 500}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter%5Bwght%5D.ttf", variable: {wght: 700}}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter-Italic%5Bwght%5D.ttf", variable: {wght: 500}}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter-Italic%5Bwght%5D.ttf", variable: {wght: 700}}

  - name: ChareInk
    description: "E-ink optimized serif based on Charis SIL (Latin, Cyrillic), from CrossInk"
    scripts: [latin, cyrillic]
    intervals: latin-ext,cyrillic
    sizes: [10, 12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/uxjulia/crossink-fonts/main/fonts/ChareInk7/ChareInk7-Regular.ttf"}
      bold:       {url: "https://raw.githubusercontent.com/uxjulia/crossink-fonts/main/fonts/ChareInk7/ChareInk7-Bold.ttf"}
      italic:     {url: "https://raw.githubusercontent.com/uxjulia/crossink-fonts/main/fonts/ChareInk7/ChareInk7-Italic.ttf"}
      bolditalic: {url: "https://raw.githubusercontent.com/uxjulia/crossink-fonts/main/fonts/ChareInk7/ChareInk7-BoldItalic.ttf"}

  - name: CrimsonPro
    description: "Elegant old-style serif (Latin)"
    scripts: [latin]
    intervals: latin-ext
    sizes: [10, 12, 14, 16, 18]
    styles:
      regular:    {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/crimsonpro/CrimsonPro%5Bwght%5D.ttf", variable: {wght: 500}}
      bold:       {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/crimsonpro/CrimsonPro%5Bwght%5D.ttf", variable: {wght: 700}}
      italic:     {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/crimsonpro/CrimsonPro-Italic%5Bwght%5D.ttf", variable: {wght: 500}}
      bolditalic: {url: "https://raw.githubusercontent.com/google/fonts/main/ofl/crimsonpro/CrimsonPro-Italic%5Bwght%5D.ttf", variable: {wght: 700}}
