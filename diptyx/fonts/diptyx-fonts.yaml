# Diptyx font pack: SD-card reader fonts curated for the Diptyx panels (~138 ppi), built with
# lib/EpdFont/scripts/build-sd-fonts.py (see diptyx/fonts/README.md). All four families (and their Mono builds) are SIL OFL 1.1. A family with `mono: true` is built with --mono (monochrome-hinted glyphs, whole-pixel advances).
scriptGroups:
- tag: latin
  label: Latin
- tag: cyrillic
  label: Cyrillic
- tag: greek
  label: Greek
families:
- name: Bitter
  description: Slab serif designed for e-ink (Latin, Cyrillic)
  scripts:
  - latin
  - cyrillic
  intervals: latin-ext,cyrillic,ipa-chars
  sizes:
  - 10
  - 12
  - 14
  - 16
  - 18
  styles:
    regular:
      url: https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter%5Bwght%5D.ttf
      variable:
        wght: 500
    bold:
      url: https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter%5Bwght%5D.ttf
      variable:
        wght: 700
    italic:
      url: https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter-Italic%5Bwght%5D.ttf
      variable:
        wght: 500
    bolditalic:
      url: https://raw.githubusercontent.com/google/fonts/main/ofl/bitter/Bitter-Italic%5Bwght%5D.ttf
      variable:
        wght: 700
- name: ChareInk
  description: E-ink optimized serif based on Charis SIL (Latin, Cyrillic), from CrossInk
  scripts:
  - latin
  - cyrillic
  intervals: latin-ext,cyrillic
  sizes:
