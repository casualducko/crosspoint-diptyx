# Diptyx font pack: mono-hinted SD-card reader fonts curated for the Diptyx panels (~138 ppi), built with
# lib/EpdFont/scripts/build-sd-fonts.py (see diptyx/fonts/README.md). All families are under the SIL Open Font License 1.1
# (licenses/). `mono: true` builds with --mono: monochrome-hinted glyphs at a whole-pixel size with whole-pixel advances.
# Families whose licence reserves their name (Merriweather, Gentium, IBM Plex, OpenDyslexic) are not shipped under that name:
# the OFL counts a format conversion as a Modified Version, which may not use a Reserved Font Name.
scriptGroups:
- tag: latin
  label: Latin
- tag: cyrillic
  label: Cyrillic
- tag: greek
  label: Greek
- tag: hebrew
  label: Hebrew
- tag: arabic
  label: Arabic
- tag: georgian
  label: Georgian
- tag: armenian
  label: Armenian
- tag: ethiopic
  label: Ethiopic
- tag: cjk
  label: CJK
- tag: hangul
  label: Korean
- tag: cherokee
  label: Cherokee
- tag: tifinagh
  label: Tifinagh
families:
- name: LiterataMono
  description: Screen-optimized serif (Latin, Greek, Cyrillic) - mono-hinted
  scripts:
  - latin
  - cyrillic
  - greek
  intervals: latin-ext,greek,cyrillic,ipa-chars
  sizes:
  - 10
  - 12
  - 14
  - 16
  - 18
  styles:
    regular:
      url: https://raw.githubusercontent.com/googlefonts/literata/main/fonts/ttf/Literata-Regular.ttf
    bold:
      url: https://raw.githubusercontent.com/googlefonts/literata/main/fonts/ttf/Literata-Bold.ttf
    italic:
      url: https://raw.githubusercontent.com/googlefonts/literata/main/fonts/ttf/Literata-Italic.ttf
    bolditalic:
      url: https://raw.githubusercontent.com/googlefonts/literata/main/fonts/ttf/Literata-BoldItalic.ttf
  mono: true
