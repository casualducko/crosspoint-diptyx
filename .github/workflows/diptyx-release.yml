name: Diptyx release

# Push a tag like `diptyx-v1.6.5-1` to build the firmware, publish a GitHub release (app image + checksum, which
# diptyx/flash.py downloads) and deploy the browser flasher (diptyx/web) to GitHub Pages.
# Tags are `diptyx-v<major>.<minor>.<patch>-<build>`; a -rc / -beta / -dev suffix in place of the build number makes a
# pre-release. Anything else is refused. Only the newest stable tag becomes "latest" and replaces the web flasher and the
# manifest the on-device update check reads (diptyx/ci/release_gate.py decides). The build runs with a read-only token;
# only the small `release` job can write to the repository.
on:
  push:
    tags: ['diptyx-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diptyx-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # the build runs PlatformIO and submodule code: no write access here
    outputs:
      prerelease: ${{ steps.gate.outputs.prerelease }}
      latest: ${{ steps.gate.outputs.latest }}
      pages: ${{ steps.gate.outputs.pages }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Release gate (tag format, pre-release, newest stable)
        id: gate
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 diptyx/ci/test_release_gate.py
          gh release list --limit 200 --json tagName,isPrerelease,isDraft > releases.json
          python3 diptyx/ci/release_gate.py "$GITHUB_REF_NAME" releases.json | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e diptyx
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
      - name: Build
        run: |
          set -euo pipefail
          # The firmware's update check compares this with the web flasher's manifest ("1.6.5-2"); other runs build "dev".
          ver="dev"
          [ "$GITHUB_REF_TYPE" = "tag" ] && ver="${GITHUB_REF_NAME#diptyx-v}"
          export PLATFORMIO_BUILD_FLAGS="-DDIPTYX_RELEASE=\\\"${ver}\\\""
          pio run -e diptyx
      - name: Web flasher tests
        run: node --test diptyx/web/test/*.test.mjs
        env:
          FIRMWARE_BIN: .pio/build/diptyx/firmware.bin
      - name: Package release assets and the web flasher
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#diptyx-v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || ver="dev-${GITHUB_SHA::7}"
          size=$(stat -c %s .pio/build/diptyx/firmware.bin)
          [ "$size" -le 6291456 ] || { echo "firmware.bin does not fit the 6 MB app slot"; exit 1; }
          mkdir -p dist site/firmware
          app="crosspoint-diptyx-${ver}-app.bin"
          cp .pio/build/diptyx/firmware.bin "dist/$app"
          cp NOTICE dist/NOTICE.txt   # licences and the written source offer travel with every release
          (cd dist && sha256sum "$app" > "$app.sha256")
          cp -R diptyx/web/index.html diptyx/web/style.css diptyx/web/js diptyx/web/vendor site/
          cp .pio/build/diptyx/firmware.bin site/firmware/crosspoint-diptyx-app.bin
          python3 - "$ver" <<'PY'
          import datetime, hashlib, json, sys
          fw = open('site/firmware/crosspoint-diptyx-app.bin', 'rb').read()
          m = json.load(open('diptyx/web/manifest.json'))
          m['version'] = sys.argv[1]
          m['released'] = datetime.date.today().isoformat()
          m['firmware'] = {'path': 'firmware/crosspoint-diptyx-app.bin', 'size': len(fw), 'sha256': hashlib.sha256(fw).hexdigest()}
          json.dump(m, open('site/manifest.json', 'w'), indent=2)
          PY
          # Notes are written with printf and explicit arguments so tag-derived text is never re-evaluated by the shell.
          printf '%s\n' \
            "CrossPoint for the Diptyx, version ${ver} (app image, ${size} bytes)." \
            "" \
            "**Easiest:** use the web flasher (Chrome/Edge) or the flash script, both described in the guide:" \
            "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/diptyx/README.md" \
            "" \
            'The `*-app.bin` file is only the app region (flashed at 0x10000); it is not a full-flash image. Verify it against the `.sha256` file. Back up your device first. Unofficial; use at your own risk.' \
            "" \
            'Licences: the firmware contains third-party libraries, notably wolfSSL under the GPL-2.0, so the binary is distributed under the GPL-2.0. The complete corresponding source is this repository at this release tag (with its freeink-sdk submodule); see the attached `NOTICE.txt` for all licences and the written source offer.' \
            > release-notes.md
      - uses: actions/upload-pages-artifact@v4
        if: steps.gate.outputs.pages == 'true'
        with:
          path: site
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-files
          path: |
            dist
            release-notes.md
          retention-days: 1

  release:
    # The only job with write access. It publishes what the build produced; nothing here runs repository code.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # creating the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          state=$(gh release list --limit 200 --json tagName,isDraft \
            --jq "map(select(.tagName == \"$tag\")) | if length == 0 then \"none\" elif .[0].isDraft then \"draft\" else \"published\" end")
          # A draft left behind by a failed run is replaced (its tag stays).
          if [ "$state" = "draft" ]; then gh release delete "$tag" --yes; state=none; fi
          if [ "$state" = "published" ]; then
            gh release upload "$tag" release/dist/* --clobber
          else
            flags=""
            [ "$PRERELEASE" = "true" ] && flags="--prerelease"
            # A draft first, published once every asset is attached: nobody can see a release without its files.
            gh release create "$tag" release/dist/* --draft $flags --title "CrossPoint for Diptyx ${tag#diptyx-v}" \
              --notes-file release/release-notes.md --verify-tag
          fi
          # "latest" is what flash.py downloads: only the newest stable release may hold it, never a pre-release or an
          # older tag pushed later.
          gh release edit "$tag" --draft=false --latest="$LATEST"

  deploy-pages:
    # Only the newest stable tagged release may replace the public web flasher and the update manifest: not a manual
    # run from a branch, not a pre-release (rc / beta / dev), not an older tag pushed after a newer release. It waits
    # for the release so the page never advertises a firmware that has no published release.
    if: needs.build.outputs.pages == 'true'
    needs: [build, release]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
